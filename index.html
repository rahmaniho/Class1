<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="مدرسه‌ی من — آموزش ریاضی، فارسی و علوم پایه‌ی اول دبستان؛ درس‌ها، تمرین‌ها و بازی‌های آموزشی.">
  <meta name="theme-color" content="#FFF8EA">
  <title>مدرسه‌ی من | آموزش کلاس اول — ریاضی، فارسی، علوم</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="مدرسه‌ی من">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* اسپلش — CSS بحرانی تا قبل از بارگذاری styles.css هم بدرخشد */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: #FFF8EA;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }
    #splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-inner {
      display: flex; flex-direction: column; align-items: center;
      gap: 22px; text-align: center; padding: 24px;
    }
    .splash-logo {
      position: relative; width: 118px; height: 118px;
      animation: splash-pop 0.85s cubic-bezier(0.2, 0.8, 0.25, 1) both;
    }
    .splash-logo img { width: 100%; height: 100%; object-fit: contain; }
    .splash-orbit {
      position: absolute; inset: -9px; border-radius: 50%;
      border: 2px dashed rgba(0, 36, 150, 0.35);
      animation: splash-spin 11s linear infinite;
    }
    .splash-orbit-2 {
      inset: -17px; border: 1.5px solid rgba(0, 36, 150, 0.14);
      border-top-color: rgba(0, 100, 255, 0.5);
      animation: splash-spin 5.5s linear infinite reverse;
    }
    .splash-wordmarks {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      animation: splash-rise 0.7s 0.3s cubic-bezier(0.2, 0.8, 0.25, 1) both;
    }
    .splash-wordmarks img { width: auto; display: block; }
    .splash-wm-fa { height: 46px; }
    .splash-wm-en { height: 23px; }
    .splash-load {
      width: 210px; height: 10px; border-radius: 99px;
      background: rgba(23, 33, 58, 0.09);
      border: 1.5px solid rgba(23, 33, 58, 0.14);
      overflow: hidden;
      animation: splash-rise 0.7s 0.5s cubic-bezier(0.2, 0.8, 0.25, 1) both;
    }
    .splash-load i {
      display: block; height: 100%; width: 42%;
      border-radius: 99px;
      background: linear-gradient(90deg, #FF6B5E, #FFD45A);
      animation: splash-slide 1.15s ease-in-out infinite;
    }
    .splash-dots { display: flex; gap: 9px; animation: splash-rise 0.7s 0.65s both; }
    .splash-dots i {
      width: 9px; height: 9px; border-radius: 50%;
      background: #FF6B5E; border: 1.5px solid #17213A;
      animation: splash-bounce 1s ease-in-out infinite;
    }
    .splash-dots i:nth-child(2) { animation-delay: 0.15s; background: #FFD45A; }
    .splash-dots i:nth-child(3) { animation-delay: 0.3s; background: #4D9BE6; }
    .splash-caption {
      font-size: 14px; font-weight: 700; color: #687187;
      animation: splash-fade 0.9s 0.7s both;
    }
    .splash-dedication {
      position: absolute; bottom: 34px; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      color: #17213A; font-size: 15px; font-weight: 800;
      animation: splash-fade 1s 0.85s both;
    }
    .splash-dedication svg { width: 18px; height: 18px; flex: none; }
    @keyframes splash-pop {
      from { opacity: 0; transform: scale(0.55) rotate(-14deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @keyframes splash-rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes splash-slide {
      0% { transform: translateX(-110%); }
      55%, 100% { transform: translateX(260%); }
    }
    @keyframes splash-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }
    @keyframes splash-fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash { animation: none !important; transition: opacity 0.2s; }
      .splash-load i { width: 100%; transform: none; }
    }
  </style>
  <noscript><style>#splash { display: none; }</style></noscript>
</head>
<body>
  <div id="splash" role="status" aria-label="در حال بارگذاری">
    <div class="splash-inner">
      <div class="splash-logo">
        <img src="images/karensoft/mark.png" alt="KarenSoft">
        <span class="splash-orbit"></span>
        <span class="splash-orbit splash-orbit-2"></span>
      </div>
      <div class="splash-wordmarks">
        <img class="splash-wm-fa" src="images/karensoft/wordmark-fa.png" alt="کارن سافت">
        <img class="splash-wm-en" src="images/karensoft/wordmark-en.png" alt="Karensoft">
      </div>
      <div class="splash-load"><i></i></div>
      <div class="splash-dots"><i></i><i></i><i></i></div>
      <div class="splash-caption">در حال آماده‌سازی مدرسه‌ی من…</div>
    </div>
    <div class="splash-dedication">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,0 13.91,7.38 20.49,3.51 16.62,10.09 24,12 16.62,13.91 20.49,20.49 13.91,16.62 12,24 10.09,16.62 3.51,20.49 7.38,13.91 0,12 7.38,10.09 3.51,3.51 10.09,7.38" fill="#FFD45A" stroke="#17213A" stroke-width="1.6" stroke-linejoin="round"/></svg>
      تقدیم به دبستان شهید قاسمی مهرگان
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,0 13.91,7.38 20.49,3.51 16.62,10.09 24,12 16.62,13.91 20.49,20.49 13.91,16.62 12,24 10.09,16.62 3.51,20.49 7.38,13.91 0,12 7.38,10.09 3.51,3.51 10.09,7.38" fill="#FFD45A" stroke="#17213A" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <script>
    /* بستن اسپلش: پس از load + حداقل نمایش، با سقف انتظار */
    (function () {
      var s = document.getElementById('splash');
      if (!s) return;
      var finished = false, hidden = false;
      function hide() {
        if (hidden) return;
        hidden = true;
        s.classList.add('is-hidden');
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 700);
      }
      function finish() {
        if (finished) return;
        finished = true;
        setTimeout(hide, 2450);
      }
      if (document.readyState === 'complete') finish();
      else window.addEventListener('load', finish);
      setTimeout(finish, 4300);
    })();
  </script>
  <div id="app">
    <noscript>
      <div style="padding:40px;font-family:Tahoma,sans-serif;direction:rtl">
        <h1>مدرسه‌ی من</h1>
        <p>برای استفاده از درس‌ها و تمرین‌های تعاملی، لطفاً جاوااسکریپت مرورگر را فعال کنید.</p>
      </div>
    </noscript>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
