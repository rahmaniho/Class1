name: ساخت نسخه‌ی اندروید و بسته‌ی آفلاین

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: اندروید (APK)
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: آماده‌سازی پوشه‌ی وب
        run: node scripts/build-web.mjs

      - name: بسته‌ی آفلاین (ZIP)
        run: cd dist && zip -r ../madrese-man-web.zip . && cd ..

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: نصب وابستگی‌ها
        run: npm install --no-audit --no-fund

      - name: ساخت پروژه‌ی اندروید
        run: npx cap add android

      - name: آیکون و صفحه‌ی آغازینِ اندروید
        run: node scripts/make-android-icons.mjs

      - name: اطمینان از آیکونِ برنامه
        run: |
          RES=android/app/src/main/res
          for f in \
            mipmap-xxxhdpi/ic_launcher.png \
            mipmap-xxxhdpi/ic_launcher_round.png \
            mipmap-xxxhdpi/ic_launcher_foreground.png \
            mipmap-xxxhdpi/ic_launcher_background.png \
            mipmap-anydpi-v26/ic_launcher.xml \
            mipmap-anydpi-v26/ic_launcher_round.xml \
            drawable/splash.png \
            drawable-port-xxxhdpi/splash.png ; do
            test -s "$RES/$f" || { echo "::error::آیکون ساخته نشد: $f"; exit 1; }
          done
          grep -q ic_launcher_foreground "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          echo "آیکونِ برنامه از images/icons/class1.png ساخته شد:"
          ls -la "$RES/mipmap-xxxhdpi"

      - name: بارگذاریِ آیکون‌ها برای بازبینی
        uses: actions/upload-artifact@v4
        with:
          name: madrese-man-android-icons
          path: android/app/src/main/res/mipmap-*
          retention-days: 30

      - name: همگام‌سازی فایل‌های وب
        run: npx cap sync android

      - name: بررسیِ کلیدِ امضا
        id: emza
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
            echo "کلیدِ امضا پیدا شد — خروجیِ امضاشده ساخته می‌شود"
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "کلیدِ امضا ثبت نشده — خروجیِ آزمایشی ساخته می‌شود (راهنما: DOWNLOAD.md)"
          fi

      - name: آماده‌سازی کلیدِ امضا
        if: steps.emza.outputs.has_key == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'madreseman' }}
        run: |
          echo -n "$KEYSTORE_BASE64" | base64 --decode -o android/app/madrese-man.keystore
          cat > android/keystore.properties <<PROPS
          storeFile=madrese-man.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
          cat >> android/app/build.gradle <<GRADLE

          /* امضای رسمی — فقط وقتی کلید در دسترس است */
          def ksFile = rootProject.file("keystore.properties")
          if (ksFile.exists()) {
            def ksProps = new Properties()
            ksProps.load(new FileInputStream(ksFile))
            android {
              signingConfigs {
                release {
                  storeFile file(ksProps["storeFile"])
                  storePassword ksProps["storePassword"]
                  keyAlias ksProps["keyAlias"]
                  keyPassword ksProps["keyPassword"]
                }
              }
              buildTypes {
                release {
                  signingConfig signingConfigs.release
                  minifyEnabled false
                }
              }
            }
          }
          GRADLE
          echo "SIGNED_BUILD=true" >> $GITHUB_ENV
          echo "کلیدِ امضا آماده شد"

      - name: ساخت نسخه‌ی امضاشده (Release)
        if: steps.emza.outputs.has_key == 'true'
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          cd ..

      - name: ساخت نسخه‌ی آزمایشی (Debug)
        if: steps.emza.outputs.has_key == 'false'
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          echo "::warning::کلیدِ امضا ثبت نشده؛ خروجی با کلیدِ آزمایشی امضا شد (اندروید ممکن است هشدار نشان دهد). راهنما: DOWNLOAD.md"

      - name: آماده‌سازی خروجی
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk madrese-man-android.apk
            cp android/app/build/outputs/bundle/release/app-release.aab madrese-man-android.aab
            echo "خروجی: نسخه‌ی امضاشده (Release)"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk madrese-man-android.apk
            echo "خروجی: نسخه‌ی آزمایشی (Debug)"
          fi
          ls -la madrese-man-*

      - name: بارگذاری فایل‌ها
        uses: actions/upload-artifact@v4
        with:
          name: madrese-man-android
          path: |
            madrese-man-android.apk
            madrese-man-web.zip
          retention-days: 90

      - name: انتشار در صفحه‌ی دانلودها (Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: مدرسه‌ی من ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            madrese-man-android.*
            madrese-man-web.zip
