name: ساخت کلیدِ امضای رسمی (Keystore)

# این کار فقط یک‌بار اجرا می‌شود تا کلیدِ امضای برنامه ساخته شود.
# راهِ اجرا: تبِ Actions → این کار را انتخاب کن → Run workflow
# (یا هُل‌دادنِ تگی مانند keystore-init)

on:
  workflow_dispatch:
  push:
    tags:
      - 'keystore-*'

jobs:
  keystore:
    name: ساخت کلید
    runs-on: ubuntu-latest
    steps:
      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ساخت کلیدِ امضا
        run: |
          ALIAS="madreseman"
          PASS="$(openssl rand -base64 32 | tr -d '/+=' | head -c 24)"
          keytool -genkeypair -v \
            -keystore madrese-man.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Madreseye Man, OU=Dabestan Shahid Ghasemi, O=KarenSoft, C=IR"

          echo "$PASS" > password.txt
          base64 -w 0 madrese-man.keystore > keystore-base64.txt
          echo "" >> keystore-base64.txt

          {
            echo "=== دو راز (Secret) که باید در مخزن ثبت شوند ==="
            echo
            echo "۱) ANDROID_KEYSTORE_BASE64 ="
            cat keystore-base64.txt
            echo
            echo "۲) ANDROID_KEYSTORE_PASSWORD = $PASS"
            echo
            echo "نامِ کلید (Alias): $ALIAS"
            echo
            echo "مسیر: Settings → Secrets and variables → Actions → New repository secret"
          } > SECRETS.txt

          echo "کلید ساخته شد (اعتبار: ۱۰۰۰۰ روز)"

      - name: بارگذاریِ فایل‌ها
        uses: actions/upload-artifact@v4
        with:
          name: madrese-man-keystore
          path: |
            madrese-man.keystore
            keystore-base64.txt
            SECRETS.txt
          retention-days: 90

      - name: هشدارِ امنیتی
        run: |
          echo "::warning::مخزن عمومی است: فایل‌های این بسته (artifact) برای دیگران هم قابلِ دریافت است. همین که رازها را در تنظیماتِ مخزن ثبت کردی، این artifact را پاک کن (پایینِ همین صفحه: گزینهٔ Delete). کلید را فقط یک‌بار بساز و در جای امن نگه دار؛ در صورت گم‌شدن، امکانِ به‌روزرسانیِ برنامه از دست می‌رود."
